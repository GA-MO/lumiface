[project]
name = "lumiface-server"
version = "0.2.0"
description = "Self-hosted face verification + liveness server for Lumiface"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "numpy<2.3",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.19",
    "insightface>=0.7.3",
    "pillow>=10",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
