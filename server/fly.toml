# The public demo server (docs-site live demo). Secrets: BOOTSTRAP_API_KEY (fly secrets set).
# The demo backend (website/demo-backend) and the browsers both reach it at https://lumiface-demo.fly.dev
# (uvicorn binds IPv4 only, so the IPv6-only private network is not used).
app = "lumiface-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # What the demo copy promises: no frame outlives the verdict.
  DEBUG = "0"
  STORE_FRAMES = "0"
  BOOTSTRAP_PRESET = "balanced"
  INSIGHTFACE_HOME = "/srv/data/insightface"
  # Capacity for one shared-cpu-2x / 2GB machine: one session judged at a time (a second one queues in the
  # pool), eight sockets before SERVER_BUSY. Measured 2026-09-21 (Mac, replay of a genuine session with these
  # settings): 900 MB idle with the models loaded, 1.2 GB peak while judging — 2GB is the ceiling for suspend.
  # Two ORT threads for the two vCPUs: verdict 9.2 s after `end` instead of 11 s (five sessions, 2026-09-21);
  # the models are small, so more threads would not buy much more.
  DET_SIZE = "320"
  INFERENCE_THREADS = "2"
  MAX_CONCURRENT_ANALYSES = "1"
  MAX_OPEN_STREAMS = "8"
  RETENTION_INTERVAL_SECONDS = "300"
  SESSION_PURGE_GRACE_SECONDS = "3600"

[[mounts]]
  source = "lumiface_data"
  destination = "/srv/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Billed only while awake: the machine is suspended (RAM snapshot, models stay loaded) after a few idle
  # minutes and the next request resumes it in well under a second. "stop" instead would reload the models on
  # every wake (~40 s measured 2026-09-21, and visitors left). Suspend needs memory <= 2GB.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 16
    hard_limit = 32

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
