name: lumiface
description: Face verification with active liveness (challenges, screen flash, anti-spoof) for iOS, Android and web, backed by the Lumiface server.
version: 0.2.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.35.0"

dependencies:
  camera: ^0.12.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  google_mlkit_face_detection: ^0.15.1
  image: ^4.10.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  assets:
    - assets/lumiface_mediapipe.js
