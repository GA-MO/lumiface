<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumiface React demo</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
      main { max-width: 480px; margin: 0 auto; padding: 16px; }
      label { display: block; margin: 8px 0 4px; font-size: 13px; opacity: 0.8; }
      input, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #eee; box-sizing: border-box; }
      button { margin: 6px 6px 0 0; padding: 10px 14px; border-radius: 8px; border: 0; background: #2dd4bf; color: #012; font-weight: 600; cursor: pointer; }
      .stage { height: 70vh; border-radius: 16px; overflow: hidden; margin-top: 12px; }
      pre { background: #222; padding: 12px; border-radius: 8px; white-space: pre-wrap; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
